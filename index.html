<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111222"><meta name="description" content="PixEdit — a branded, installable creative studio powered by Photopea.">
<title>PixEdit — Creative Studio</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#111222;--panel:#191a30;--line:#30314d;--accent:#8057ff;--text:#f6f5ff;--muted:#b7b8d0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#9b70ff,#3867ff);font-weight:900;font-size:20px}.brandname{font-weight:850;font-size:20px;letter-spacing:.2px}.brandname span{color:#aa8cff}.tagline{font-size:11px;color:var(--muted);margin-top:1px}
.actions{display:flex;align-items:center;gap:8px}.status{font-size:12px;color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid #484969;border-radius:8px;padding:8px 11px;background:#242541;color:var(--text)}button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}button:hover{filter:brightness(1.12)}
.editor{flex:1;min-height:0;position:relative;background:#242424}.editor iframe{display:block;width:100%;height:100%;border:0;background:#242424}
.bottombar{height:27px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 11px;background:var(--panel);border-top:1px solid var(--line);font-size:10px;color:var(--muted);gap:10px}
.notice{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2;max-width:min(720px,94vw);padding:9px 12px;background:#17182eef;border:1px solid #47496c;border-radius:10px;font-size:12px;color:#f4f1ff;box-shadow:0 8px 24px #0005}.notice[hidden]{display:none}
@media(max-width:560px){.topbar{height:54px;padding:6px 9px}.brandname{font-size:17px}.tagline{display:none}.logo{width:32px;height:32px}.status{display:none}.actions{gap:5px}button{padding:7px 8px;font-size:12px}.bottombar span:last-child{display:none}}
</style></head><body>
<div class="app"><header class="topbar"><div class="brand" aria-label="PixEdit"><div class="logo">P</div><div><div class="brandname">Pix<span>Edit</span></div><div class="tagline">Your creative studio</div></div></div>
<div class="actions"><span class="status">Photopea editor embedded</span><button id="installBtn" hidden>Install app</button><button id="openBtn" class="primary">Open editor in new tab ↗</button></div></header>
<main class="editor"><div class="notice" id="notice">Loading the full Photopea editor… If it does not appear, choose “Open editor in new tab”.</div>
<iframe id="photopea" title="Photopea image editor inside PixEdit" src="https://www.photopea.com/" allow="clipboard-read; clipboard-write" allowfullscreen></iframe></main>
<footer class="bottombar"><span>PixEdit Creative Studio</span><span>Powered by Photopea · Export your work from the editor</span></footer></div>
<script>
const frame=document.getElementById('photopea');
document.getElementById('openBtn').addEventListener('click',()=>window.open('https://www.photopea.com/','_blank','noopener,noreferrer'));
frame.addEventListener('load',()=>{document.getElementById('notice').hidden=true;});
let installPrompt;const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installBtn.hidden=false;});
installBtn.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true;});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script></body></html>
