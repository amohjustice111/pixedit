<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PixEdit — Photo Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;

    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    header {
      min-height: 62px;
      display: flex;

      gap: 12px;
      padding: 10px 18px;
      background: #17182f;
      border-bottom: 1px solid #303252;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      color: white;
      font-size: 20px;
    }

    .brand span {
      color: #a78bfa;
    }

    .tagline {
      color: #b9bbd6;
      font-size: 12px;
      margin-top: 3px;
    }

    .open-button {
      color: white;
      background: #6d4aff;
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .editor {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #252525;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #252525;
    }

    footer {
      min-height: 28px;
      display: flex;
      justify-content: space-between;

      border-top: 1px solid #303252;

      header {
        min-height: 56px;

</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">P</div>
        <div>
          Pix<span>Edit</span>
          <div class="tagline">Your creative studio</div>
        </div>
      </div>

      <button class="open-button" id="openEditor">
        Open Editor ↗
      </button>
    </header>

    <main class="editor">
      <iframe
        id="photopea"
        title="PixEdit image editor"
        src="https://www.photopea.com/"
        allow="clipboard-read; clipboard-write"
        allowfullscreen>
      </iframe>
    </main>

    </footer>
  </div>

  <script>

      window.open("https://www.photopea.com/", "_blank", "noopener");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (error) {
          console.log("Offline support registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
